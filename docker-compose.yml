services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: konumlu-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-konumlu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konumlu}
      POSTGRES_DB: ${POSTGRES_DB:-konumlu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - konumlu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Derived store only (D-005). No named volume: data is disposable/rebuildable.
  valkey:
    image: valkey/valkey:8.1.10-alpine
    container_name: konumlu-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: konumlu-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-konumlu}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-konumlu-dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - konumlu_minio_data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: konumlu-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-konumlu}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-konumlu-dev}
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          i=$$((i+1))
          if [ "$$i" -gt 40 ]; then exit 1; fi
          sleep 1
        done
        mc mb -p local/konumlu-media
        mc anonymous set none local/konumlu-media

volumes:
  konumlu_postgres_data:
  konumlu_minio_data:
