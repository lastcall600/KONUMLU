name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.74.0"
  TRIVY_LINUX_64BIT_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
  SYFT_VERSION: "1.51.1"
  SYFT_LINUX_AMD64_SHA256: "8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test
        run: go -C backend test ./...

      - name: Architecture check
        run: go -C backend run ./cmd/archcheck

  consumer:
    name: consumer-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/apps/consumer
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/apps/consumer/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  admin:
    name: admin-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/apps/admin
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/apps/admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  migration-smoke:
    name: migration-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fresh PostGIS sidecar (compose pin postgis/postgis:16-3.5). 000001 CREATE EXTENSION
    # postgis and later geography columns fail without the extension.
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: konumlu
          POSTGRES_PASSWORD: konumlu
          POSTGRES_DB: konumlu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U konumlu -d konumlu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://konumlu:konumlu@127.0.0.1:5432/konumlu?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply migrations
        run: go -C backend run ./cmd/migrate up

      - name: Verify migration version
        run: |
          set -euo pipefail
          version="$(go -C backend run ./cmd/migrate version)"
          if [[ "$version" == *"dirty"* ]]; then
            echo "dirty migration state: ${version}"
            exit 1
          fi
          if [[ "$version" == "none" || -z "$version" ]]; then
            echo "expected applied version, got: ${version}"
            exit 1
          fi
          latest="$(find backend/migrations -maxdepth 1 -name '*.up.sql' -printf '%f\n' | sed -E 's/^([0-9]+).*/\1/' | sort -n | tail -1)"
          latest_num=$((10#$latest))
          if [[ "$version" != "$latest_num" ]]; then
            echo "applied version ${version} does not match latest migration ${latest_num}"
            exit 1
          fi
          echo "migration version ${version} (latest)"

  backend-container:
    name: backend-container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Same Dockerfile; COMMAND selects cmd/server vs cmd/worker (distinct binaries).
      - name: Build backend server image
        run: docker build -f backend/Dockerfile --build-arg COMMAND=server -t konumlu-backend:ci-server backend

      - name: Build backend worker image
        run: docker build -f backend/Dockerfile --build-arg COMMAND=worker -t konumlu-backend:ci-worker backend

  dependency-security:
    name: dependency-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Go vulnerability scan (govulncheck)
        working-directory: backend
        run: |
          set -euo pipefail
          govulncheck -json ./... > "${GITHUB_WORKSPACE}/govulncheck.jsonl" || true
          go run "${GITHUB_WORKSPACE}/.github/security/check_govulncheck.go" \
            "${GITHUB_WORKSPACE}/govulncheck.jsonl" \
            "${GITHUB_WORKSPACE}/.github/security/govulncheck-known.txt"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: npm audit consumer lockfile
        working-directory: web/apps/consumer
        run: npm audit --package-lock-only --audit-level=high

      - name: npm audit admin lockfile
        working-directory: web/apps/admin
        run: npm audit --package-lock-only --audit-level=high

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Prove scanner detects a fixture
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          # Assemble PEM-shaped armor only in the ephemeral probe file.
          # Do not store a contiguous private-key block in repository source.
          {
            printf '%s%s\n' '-----BEGIN' ' RSA PRIVATE KEY-----'
            printf 'MIIE'
            printf 'A%.0s' {1..200}
            printf '==\n'
            printf '%s%s\n' '-----END' ' RSA PRIVATE KEY-----'
          } > "${probe}/probe.txt"
          if gitleaks detect --config .gitleaks.toml --source "${probe}" --no-git --redact --exit-code 1; then
            echo "gitleaks did not fail on the probe fixture" >&2
            exit 1
          fi

      - name: Scan repository history
        run: gitleaks detect --config .gitleaks.toml --source . --redact --exit-code 1 --verbose

  authorization-security:
    name: authorization-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Staff IAM and fail-closed tests
        run: |
          go -C backend test ./internal/staffauth/... ./internal/infrastructure/staffidp/... ./cmd/server/ -count=1

      - name: High-risk authorization HTTP tests
        run: |
          go -C backend test ./internal/listings/httpapi/ ./internal/identity/publicprofile/ ./internal/moderation/httpapi/ ./internal/trust/httpapi/ ./internal/disputes/httpapi/ ./internal/transactions/httpapi/ ./internal/verified/httpapi/ ./internal/media/httpapi/ ./internal/payments/httpapi/ -count=1

  container-security:
    name: container-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build backend server image
        run: docker build -f backend/Dockerfile --build-arg COMMAND=server -t konumlu-backend:ci-server backend

      - name: Build backend worker image
        run: docker build -f backend/Dockerfile --build-arg COMMAND=worker -t konumlu-backend:ci-worker backend

      - name: Install Trivy
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_LINUX_64BIT_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Scan server image (fail on new fixed CRITICAL)
        run: |
          mkdir -p security-reports
          trivy image --ignorefile .trivyignore --severity CRITICAL --ignore-unfixed --exit-code 1 --format json \
            --output security-reports/trivy-server-critical.json konumlu-backend:ci-server
          trivy image --ignorefile .trivyignore --severity HIGH,MEDIUM,LOW --format table konumlu-backend:ci-server \
            | tee security-reports/trivy-server-all.txt

      - name: Scan worker image (fail on new fixed CRITICAL)
        run: |
          mkdir -p security-reports
          trivy image --ignorefile .trivyignore --severity CRITICAL --ignore-unfixed --exit-code 1 --format json \
            --output security-reports/trivy-worker-critical.json konumlu-backend:ci-worker
          trivy image --ignorefile .trivyignore --severity HIGH,MEDIUM,LOW --format table konumlu-backend:ci-worker \
            | tee security-reports/trivy-worker-all.txt

      - name: Upload container scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-security-reports
          path: security-reports/
          if-no-files-found: warn

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Syft
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_LINUX_AMD64_SHA256}  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C /tmp syft
          sudo install -m 0755 /tmp/syft /usr/local/bin/syft
          syft version

      - name: Generate CycloneDX SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom
          syft dir:backend --exclude '**/.git/**' -o cyclonedx-json=sbom/backend.cdx.json
          syft dir:web/apps/consumer --exclude '**/node_modules/**' --exclude '**/.next/**' -o cyclonedx-json=sbom/consumer.cdx.json
          syft dir:web/apps/admin --exclude '**/node_modules/**' --exclude '**/.next/**' -o cyclonedx-json=sbom/admin.cdx.json
          test -s sbom/backend.cdx.json
          test -s sbom/consumer.cdx.json
          test -s sbom/admin.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom/*.cdx.json
          if-no-files-found: error
